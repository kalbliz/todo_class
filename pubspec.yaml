
name: todo_class
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  fl_chart: ^1.2.0
  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.19.0
  table_calendar: ^3.1.3
  horizontal_week_calendar: ^0.0.20
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  iconsax: ^0.0.8
  syncfusion_flutter_charts: ^35.1.40+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/bottom_nav/
    - assets/icons/common/
    - assets/icons/tasks/
    - assets/icons/auth/
    - assets/icons/profile/
    - assets/svg/
    - assets/svg/icons/
    - assets/svg/illustrations/
    - assets/images/
    - assets/images/brand/
    - assets/images/illustrations/
    - assets/images/backgrounds/
    - assets/images/empty_states/
    - assets/images/onboarding/
    - assets/animations/
